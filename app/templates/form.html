<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета пользователя</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Анкета пользователя</h1>

        <form method="POST" class="mb-5">
            <div class="mb-3">
                <label for="name" class="form-label">Имя:</label>
                <input type="text" class="form-control" id="name" name="name" required
                       value="{{ name if name else '' }}">
            </div>

            <div class="mb-3">
                <label for="city" class="form-label">Город:</label>
                <input type="text" class="form-control" id="city" name="city" required
                       value="{{ city if city else '' }}">
            </div>

            <div class="mb-3">
                <label for="hobby" class="form-label">Хобби:</label>
                <input type="text" class="form-control" id="hobby" name="hobby" required
                       value="{{ hobby if hobby else '' }}">
            </div>

            <div class="mb-3">
                <label for="age" class="form-label">Возраст:</label>
                <input type="number" class="form-control" id="age" name="age" required min="1" max="120"
                       value="{{ age if age else '' }}">
            </div>

            <button type="submit" class="btn btn-primary">Отправить</button>
        </form>

        {% if submitted %}
        <div class="card">
            <div class="card-header">
                <h2 class="h5">Введенные данные:</h2>
            </div>
            <div class="card-body">
                <p><strong>Имя:</strong> {{ name }}</p>
                <p><strong>Город:</strong> {{ city }}</p>
                <p><strong>Хобби:</strong> {{ hobby }}</p>
                <p><strong>Возраст:</strong> {{ age }}</p>
            </div>
        </div>
        {% endif %}
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
